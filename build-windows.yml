name: Gerar instalador Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install
      - name: Gerar instalador
        run: npm run windows:build
      - name: Publicar para download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-latest --yes --cleanup-tag || true
          gh release create windows-latest dist/Voice-Bedrock-Elfu-Setup.exe --title "Voice Bedrock Elfu para Windows" --notes "Baixe o arquivo Voice-Bedrock-Elfu-Setup.exe, execute e instale."
